<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./card.css">
    <title>Card Bank</title>
</head>

<body>

    <img class="loadingLogo" width="130" height="130" src="./images/loading.svg" alt="loading">
    <section class="bank-cards-sect">
        <div class="card-reciever">
            <h4 class="recieve-card-title">Checkout</h4>

            <div class="cards">
                <div class="card-data">

                </div>
            </div>

            <div class="card-add-btn-contant">
                <button class="delete-all-btn">DeleteAll</button>
            </div>
        </div>
        </div>
        <div class="card-block-add">
            <h4 class="add-card-title">Add Card</h4>
            <div class="card-add-details">
                <p class="enter-details-text">Enter details</p>

                <p class="input-name-class">Name</p>
                <input class="input-name" type="text">


                <p class="input-data-class">Number</p>
                <div class="wrapper">
                    <input class="input-data" type="text" maxlength="16">
                    <img class="visa-pos" src="./images/visaLogo.png" alt="">
                </div>

            </div>

            <div class="card-add-btn-contant">
                <button class="save-btn">Save</button>
            </div>
        </div>
    </section>


    <script src="./card.js"></script>
</body>

</html>
